<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - ENEE</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b1622; color: white; margin: 0; padding: 20px; }
        .admin-container { max-width: 1200px; margin: auto; text-align: center; }
        .logo-admin { width: 180px; margin-bottom: 20px; }
        h2 { color: #f1c40f; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .tabla-contenedor { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; color: #333; }
        thead { background: #1c2833; color: #f1c40f; }
        th { padding: 15px; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; text-align: center; }
        tr:hover { background-color: #f9f9f9; }
        .btn-ver { color: #2980b9; text-decoration: none; font-weight: bold; }
        .loader { color: #f1c40f; margin: 20px; display: block; }
    </style>
</head>
<body>

<div class="admin-container">
    <!-- Logo Corregido -->
    <img src="https://raw.githubusercontent.com/proyectosjdop-alfa/app_poda/refs/heads/main/imagenes/enee_logo.png" class="logo-admin" alt="ENEE">
    
    <h2>Panel de Control Central</h2>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Fecha Reg.</th>
                    <th>Sector</th>
                    <th>Circuito</th>
                    <th>M. Brecha</th>
                    <th>M. Poda</th>
                    <th>Pago MO</th>
                    <th>Mapa</th>
                </tr>
            </thead>
            <tbody id="admin-tbody">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
        <div id="loading-msg" class="loader">Cargando registros...</div>
    </div>
</div>

<script>
    const API_URL = "https://api-poda.proyectos-jdop.workers.dev/";

    async function cargarDatosAdmin() {
        try {
            const response = await fetch(API_URL);
            const datos = await response.json();
            const tbody = document.getElementById('admin-tbody');
            const loader = document.getElementById('loading-msg');
            
            tbody.innerHTML = "";
            if(loader) loader.style.display = "none";

            // Usamos los nombres exactos que definiste en el Worker
            datos.reverse().forEach(reg => {
                const fila = `
                    <tr>
                        <td>${reg.fecha_trabajo || '---'}</td>
                        <td><b>${reg.sector || '---'}</b></td>
                        <td>${reg.circuito || '---'}</td>
                        <td>${reg.m_brecha || '0'}m</td>
                        <td>${reg.m_poda || '0'}m</td>
                        <td>L. ${reg.pago_mo || '0'}</td>
                        <td>
                            <a href="https://www.google.com/maps?q=${reg.gps_inicio}" 
                               target="_blank" class="btn-ver">📍 Ver Mapa</a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
        } catch (error) {
            console.error("Error cargando datos:", error);
            if(document.getElementById('loading-msg')) {
                document.getElementById('loading-msg').innerText = "Error de conexión con la base de datos.";
            }
        }
    }

    window.onload = cargarDatosAdmin;
</script>

</body>
</html>
